version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Only patch/minor flow automatically. Major bumps are breaking often enough
    # (e.g. TypeScript 6 / ESLint 10 / simplewebauthn 13) that they get handled
    # deliberately + tested, not auto-merged. Bump these by hand when ready.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Batch low-risk dev/tooling bumps into one PR.
      dev-dependencies:
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
